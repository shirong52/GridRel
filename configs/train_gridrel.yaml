# Stage 2: GridRel scorer — Concat(M, M^A, G, R) + reshape3d + CLS/Conv3d dual branch.
# Paper hyperparameters: batch 16, lr 0.002, dropout 0.1, 3 epochs.
run_id: gridrel_seed15
stage: method
variant: gridrel

paths:
  # Objaverse spatial train data lives under DCSM_Ideal_CLIP/data
  repo_root: /root/autodl-tmp/DCSM_Ideal_CLIP
  data_path: data
  clip_model: /root/autodl-tmp/model/clip_vit_b
  alignment_checkpoint: /root/autodl-tmp/GridRel/alignment/runs/bilinear_swap_rank16_seed15/checkpoints/bilinear_metric.pt
  model_save_path: /root/autodl-tmp/GridRel/runs/gridrel_seed15/checkpoints
  figure_save_path: /root/autodl-tmp/GridRel/runs/gridrel_seed15/figures

train:
  datasets:
    - spatial
  batch_size: 16
  learning_rate: 0.002
  epochs: 3
  seed: 15
  dropout: 0.1
  device: cuda
  scorer_type: conv3d
  channel_mode: gridrel
  use_3d: true
  no_replacements: true
  hidden_dim: 128
